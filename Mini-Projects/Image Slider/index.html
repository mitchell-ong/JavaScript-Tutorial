<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Image Slider</title>
</head>
<body>

    <div class="slider">
        <div class="slides">
            <img class="slide" src="Everest.png" height="500">
            <img class="slide" src="Mudbath.png" height="500">
            <img class="slide" src="Supersonic+Red.png" height="500">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>

    <script src="image-slider.js"></script>
</body>
</html>

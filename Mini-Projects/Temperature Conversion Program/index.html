<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Conversion</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <h1>Temperature Conversion</h1>
        <input type="number" id="textbox" value="0"><br>

        <input type="radio" id="toF" name="unit">
        <label for="toF">Celsius ➔ Fahrenheit</label><br>

        <input type="radio" id="toC" name="unit">
        <label for="toC">Fahrenheit ➔ Celsius</label><br>

        <button type="button" onclick="convert()">Submit</button><br>

        <p id="result"></p>
    </form>
    <script src="temperature-converter.js"></script>
</body>
</html>

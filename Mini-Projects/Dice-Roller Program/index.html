<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dice Roller Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Dice Roller</h1>
        <h2 class="lucky">Feelin' Lucky?</h2>
        <label># of dice</label>
        <input type="number" id="numOfDice" value="1" min="1"><br><br>
        <button onclick="rollDice()">Roll Dice</button>
    </div>
    <div id="diceResult"></div>
    <div id="diceImages"></div>

    <script src="dice-roller.js"></script>
</body>
</html>
